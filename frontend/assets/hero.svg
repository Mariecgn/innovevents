<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-label="Illustration d'une salle de réception éclairée">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1d14"/>
      <stop offset="1" stop-color="#4b3322"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f4e37"/>
      <stop offset="1" stop-color="#34231a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1d0"/>
      <stop offset="0.55" stop-color="#f1c98e"/>
      <stop offset="1" stop-color="#c98f55"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9c2" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffe9c2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe3a8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffe3a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carpet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b58a55" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b58a55" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="floor-clip"><rect x="0" y="400" width="800" height="240"/></clipPath>
  </defs>

  <rect width="800" height="640" fill="url(#wall)"/>
  <rect width="800" height="640" fill="url(#halo)"/>

  <!-- arches vitrées -->
  <g id="arches">
    <path d="M300 400V170a100 100 0 0 1 200 0V400Z" fill="url(#glass)"/>
    <path d="M110 400V210a70 70 0 0 1 140 0V400Z" fill="url(#glass)" opacity="0.9"/>
    <path d="M550 400V210a70 70 0 0 1 140 0V400Z" fill="url(#glass)" opacity="0.9"/>
    <g stroke="#3b2819" stroke-width="5" opacity="0.7" fill="none">
      <line x1="400" y1="72" x2="400" y2="400"/>
      <line x1="300" y1="262" x2="500" y2="262"/>
      <line x1="180" y1="142" x2="180" y2="400"/>
      <line x1="110" y1="290" x2="250" y2="290"/>
      <line x1="620" y1="142" x2="620" y2="400"/>
      <line x1="550" y1="290" x2="690" y2="290"/>
    </g>
    <g fill="none" stroke="#c9a26a" stroke-width="3" opacity="0.85">
      <path d="M300 400V170a100 100 0 0 1 200 0V400"/>
      <path d="M110 400V210a70 70 0 0 1 140 0V400"/>
      <path d="M550 400V210a70 70 0 0 1 140 0V400"/>
    </g>
  </g>

  <!-- faisceaux de lumière -->
  <polygon points="350,0 450,0 600,420 200,420" fill="url(#beam)"/>
  <polygon points="90,0 150,0 330,420 20,420" fill="url(#beam)" opacity="0.55"/>
  <polygon points="650,0 710,0 780,420 470,420" fill="url(#beam)" opacity="0.55"/>

  <!-- sol et reflets -->
  <rect y="400" width="800" height="240" fill="url(#floor)"/>
  <rect y="397" width="800" height="5" fill="#c9a26a" opacity="0.75"/>
  <g clip-path="url(#floor-clip)" transform="translate(0 800) scale(1 -1)" opacity="0.14">
    <use href="#arches"/>
  </g>

  <!-- tapis central -->
  <polygon points="372,404 428,404 560,640 240,640" fill="url(#carpet)"/>

  <!-- lustre -->
  <g>
    <circle cx="400" cy="58" r="70" fill="url(#glow)" opacity="0.65"/>
    <line x1="400" y1="0" x2="400" y2="46" stroke="#c9a26a" stroke-width="2"/>
    <ellipse cx="400" cy="52" rx="64" ry="9" fill="none" stroke="#c9a26a" stroke-width="3"/>
    <g fill="#ffe9bd">
      <circle cx="342" cy="55" r="4"/>
      <circle cx="371" cy="61" r="4"/>
      <circle cx="400" cy="63" r="4"/>
      <circle cx="429" cy="61" r="4"/>
      <circle cx="458" cy="55" r="4"/>
    </g>
  </g>

  <!-- bokeh -->
  <g fill="#ffe3a8">
    <circle cx="70" cy="90" r="22" opacity="0.1"/>
    <circle cx="130" cy="40" r="10" opacity="0.18"/>
    <circle cx="720" cy="70" r="26" opacity="0.1"/>
    <circle cx="670" cy="30" r="9" opacity="0.2"/>
    <circle cx="40" cy="330" r="14" opacity="0.12"/>
    <circle cx="760" cy="300" r="16" opacity="0.12"/>
  </g>

  <!-- tables du fond -->
  <g id="table-back">
    <ellipse cx="190" cy="508" rx="56" ry="10" fill="#000" opacity="0.28"/>
    <path d="M138 468v38a52 12 0 0 0 104 0v-38Z" fill="#e4d5c0"/>
    <ellipse cx="190" cy="468" rx="52" ry="13" fill="#f7f0e6"/>
    <circle cx="190" cy="462" r="16" fill="url(#glow)"/>
    <circle cx="190" cy="464" r="3" fill="#ffe3a8"/>
  </g>
  <use href="#table-back" x="420"/>
  <g>
    <ellipse cx="400" cy="486" rx="48" ry="9" fill="#000" opacity="0.28"/>
    <path d="M356 452v32a44 10 0 0 0 88 0v-32Z" fill="#e4d5c0"/>
    <ellipse cx="400" cy="452" rx="44" ry="11" fill="#f7f0e6"/>
    <circle cx="400" cy="447" r="14" fill="url(#glow)"/>
    <circle cx="400" cy="449" r="3" fill="#ffe3a8"/>
  </g>

  <!-- tables du premier plan -->
  <g id="table-front">
    <ellipse cx="170" cy="604" rx="104" ry="18" fill="#000" opacity="0.3"/>
    <path d="M84 548v56a86 20 0 0 0 172 0v-56Z" fill="#e4d5c0"/>
    <ellipse cx="170" cy="548" rx="86" ry="21" fill="#f7f0e6"/>
    <circle cx="170" cy="540" r="26" fill="url(#glow)"/>
    <circle cx="170" cy="543" r="4.5" fill="#ffe3a8"/>
    <ellipse cx="136" cy="548" rx="14" ry="4" fill="#c9a26a" opacity="0.55"/>
    <ellipse cx="206" cy="550" rx="14" ry="4" fill="#c9a26a" opacity="0.55"/>
  </g>
  <use href="#table-front" x="460"/>
</svg>
