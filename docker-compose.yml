services:
  backend:
    build: ./backend
    container_name: innovevents_backend
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - mariadb
      - mongo
    volumes:
      - ./frontend:/app/frontend
      - ./docs:/app/docs
  mariadb:
    image: mariadb:11
    container_name: innovevents_mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: innovevents
      MARIADB_USER: innovevents
      MARIADB_PASSWORD: innovevents
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/sql:/docker-entrypoint-initdb.d
  mongo:
    image: mongo:7
    container_name: innovevents_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
volumes:
  mariadb_data:
  mongo_data:
